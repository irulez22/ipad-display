name: Build Linux Receiver

on:
  push:
    branches: [main]
    paths:
      - "tools/linux-receiver/**"
      - ".github/workflows/build-linux-receiver.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev libavcodec-dev libavutil-dev libswscale-dev
      - name: Build
        run: sh tools/linux-receiver/build.sh
