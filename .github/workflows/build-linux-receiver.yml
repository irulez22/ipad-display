name: Build Linux Receiver

on:
  push:
    branches: [main]
    paths:
      - "tools/linux-receiver/**"
      - "tests/**"
      - "test.h264"
      - ".github/workflows/build-linux-receiver.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev libsdl2-ttf-dev libavcodec-dev libavutil-dev libswscale-dev libgl1-mesa-dev libx11-dev
      - name: Build
        run: sh tools/linux-receiver/build.sh
      - name: Native regression checks
        run: python3 -m unittest discover -s tests -v
