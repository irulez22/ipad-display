name: Regression checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Check native audio and display helpers
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          python -m unittest discover -s tests -p test_windows_helpers.py -v
      - name: Check display lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_cloudbook_display.ps1
      - name: Compile launcher without installing it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll /out:PadDisplayLauncher.exe "$PWD\tools\windows-launcher\PadDisplayLauncher.cs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  parser:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Annex-B packet boundaries and memory limit
        run: |
          clang -fobjc-arc -framework Foundation -Isrc/Video tests/test_h264_parser.m src/Video/PDH264Parser.m -o /tmp/test-h264
          /tmp/test-h264
